[project]
name = "mxm-mcp"
version = "0.2.0"
description = "MCP Server for MXM - AI-powered music production with MXM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "TypeWolf" },
]
keywords = ["mcp", "mxm", "music", "daw", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mcp>=2.0.0",
    "rdflib>=7.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/realrandolph/mxm-mcp"
Repository = "https://github.com/realrandolph/mxm-mcp"
Issues = "https://github.com/realrandolph/mxm-mcp/issues"

[project.scripts]
mxm-mcp = "mxm_mcp.server:main"
lmms-mcp = "mxm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mxm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises an installed MXM application and plugins",
    "slow: exercises large arrangement or render-scale operations",
]
